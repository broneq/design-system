<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px}.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}.n{font-size:13px;font-weight:600;color:var(--fg-default);margin-top:8px}</style></head><body><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><span class="bn-btn bn-btn--primary">Default</span><span class="bn-btn bn-btn--primary" style="background:var(--accent-hover)">Hover</span><span class="bn-btn bn-btn--primary" style="background:var(--accent-press)">Press</span><span class="bn-btn bn-btn--primary" style="outline:var(--focus-width) solid var(--focus-color);outline-offset:var(--focus-offset)">Focus</span><input class="bn-input" style="outline:var(--focus-width) solid var(--focus-color);outline-offset:0;border-color:var(--focus-color);width:200px" value="Focus input"></div><p class="v" style="margin-top:24px">--ease-out cubic-bezier(.22,.61,.36,1) · --dur-fast 150ms · --dur-base 250ms · --dur-enter 600ms fade-in-up 16px · focus = 2px solid --focus-color outline, offset 2px, on every :focus-visible · shadows only on printed docs (--shadow-doc) and popovers (--shadow-pop)</p></body></html>
