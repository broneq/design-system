<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:28px}.lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted)}.v{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted)}.n{font-size:13px;font-weight:600;color:var(--fg-default);margin-top:8px}body{padding:0}</style></head><body><div class="bn-dark" style="display:grid;grid-template-columns:1fr 1fr;height:244px;position:relative;overflow:hidden"><div style="padding:28px;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:12px"><p class="lbl">Rules</p><ul class="list-check" style="font-size:14px"><li>Illustrated avatar (consistent style) or dark-lit portrait</li><li>Right side, 56% width, gradient fade to --bg-page</li><li>Never boxed with rounded corners in the hero</li></ul></div><div style="background:repeating-linear-gradient(135deg,var(--bn-ink-800) 0 12px,var(--bn-ink-850) 12px 24px);display:grid;place-items:center"><span class="lbl">avatar slot</span></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,var(--bg-page) 48%,transparent 80%);pointer-events:none"></div></div></body></html>
