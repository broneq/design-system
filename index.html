<template id="readme"><h1>Broniszewski. — design system v2</h1>
<p>Personal brand system for <strong>Przemysław Broniszewski</strong> — architect helping software teams redesign their process and bring AI into the SDLC. Used for the website, slide decks / workshops, PDF offers and LinkedIn (single posts, carousels, banner).</p>
<p>v2 (2026) replaces the v1 system extracted from <code>broneq/personal-website</code>. The blue stays; everything around it is modernised: dark-first, technical, editorial type.</p>
<h2>Brand in one paragraph</h2>
<p>Dark ink surfaces on an 80px technical grid, a heavy tight <strong>Archivo 800</strong> headline that always ends with a <strong>blue period</strong>, Geist for reading, <strong>JetBrains Mono</strong> uppercase labels prefixed with <code>//</code>. Blue (#3D6BFF) carries every action. Orange (#FF6B3D) is a <em>signal</em> — a pulsing live dot, the current segment, the AI step — at most once per view. Corners are nearly square (2–4px). Imagery is a single avatar/portrait that fades into the dark page.</p>
<h2>Content fundamentals</h2>
<ul>
<li><strong>Language:</strong> Polish by default. First person singular (&quot;Pomagam&quot;, &quot;Projektuję&quot;), address the reader as &quot;Ty/Wasz zespół&quot;. Never &quot;we&quot;.</li>
<li><strong>Tone:</strong> direct, concrete, engineering-literate. Short declarative headlines with a period. No hype words, no exclamation marks, no emoji.</li>
<li><strong>Casing:</strong> sentence case for headlines and body; mono labels &amp; CTAs are uppercase via CSS — write them in sentence case in source.</li>
<li><strong>Headlines:</strong> 2–5 words per line, max 2–3 lines. Optional grey second line (<code>titleMuted</code>) for the &quot;so what&quot;.</li>
<li><strong>CTAs:</strong> verb-first, 1–3 words: &quot;Umów rozmowę&quot;, &quot;Case studies&quot;, &quot;Zobacz program&quot;.</li>
<li><strong>Numbers:</strong> only when they carry proof (weeks, team size). Numbered sections use &quot;01 —&quot;.</li>
</ul>
<h2>Visual foundations</h2>
<ul>
<li><strong>Themes:</strong> light (default) and <code>.bn-dark</code> — same semantic tokens flip. Hero, page headers, footer, slides and banner are dark; content sections are light; one blue band (FinalCTA) per page.</li>
<li><strong>Color:</strong> <code>--accent</code> (#3D6BFF) for marks - period, bars, bullets, current nav dot; <code>--accent-fill</code> (#2D5BFF) for surfaces that carry text - primary buttons, FinalCTA band; <code>--accent-text</code> for links. <code>--signal</code> orange is a marker with exactly two uses: the LiveBadge dot and the current Segment - never list markers, nav, or form marks. Ink scale 950→50 for everything else. No gradients except the portrait fade.</li>
<li><strong>Type:</strong> Archivo 800 display/H1/H2 (−0.045 to −0.055em, line-height .88–.95); Archivo 700 H3/H4; Geist 17/1.6 body, 18–21 lead; JetBrains Mono 13px/0.14em labels, 13px/0.12em CTAs.</li>
<li><strong>Motifs:</strong> (1) technical grid (<code>.bn-grid</code>, 80px / 40px <code>--sm</code>; <code>.bn-grid--fade</code> on light <code>.section--subtle</code> sections so they carry the same texture as the dark ones), (2) <code>//</code> eyebrow, (3) blue period, (4) LiveBadge orange dot, (5) Segments progress bars + 01/06 Counter — used on slides, carousels, process steps.</li>
<li><strong>Layout:</strong> 1312px container, 20–64px fluid side padding, fluid section rhythm (<code>--section-y</code> 72→120px, <code>--section-y-tight</code> 48→72px, <code>--section-head-gap</code> 40→64px between 390px and 1200px), left-aligned. Multi-column content uses <code>.bn-cols</code> (<code>--2</code>/<code>--3</code>/<code>--4</code>/<code>--split</code>, gap via <code>--cols-gap</code>): <code>--3</code>/<code>--4</code> drop to 2 columns ≤1024px (an odd last <code>--3</code> item spans the full row), everything is 1 column ≤768px - never hand-written <code>grid-template-columns</code>. <code>.bn-cols--fixed</code> keeps a <code>--3</code>/<code>--4</code> count at 769-1024px for short items (stats, plain cards). <code>.bn-cols--mobile-reverse</code> puts the last column first on mobile (e.g. the contact form before the &quot;what happens next&quot; steps). Breakpoints are only 1024px and 768px. A section header with an action beside it goes in <code>.bn-section-row</code>; process steps are <code>li.bn-step</code> (a one-segment <code>Segments</code> bar as the top edge of a <code>ServiceCard</code>, lit only on the highlighted step); prev/next links at the end of an article use <code>nav.bn-post-nav</code> inside a <code>.container.bn-article-grid</code>, so they line up with the prose column (<code>a.prev</code>/<code>a.next</code> with <code>.dir</code> + <code>.title</code>). Direct contact links under a column go in <code>.bn-contact-direct</code> (Eyebrow, 44px-tall links, LiveBadge). Text only for screen readers uses <code>.bn-sr-only</code>. A source line under stats is <code>p.bn-footnote</code>; a list under its own Eyebrow gets <code>ul.bn-fit-list</code>. Grids use hairlines (1px <code>--line-default</code>, 2px <code>--line-strong</code> for table tops) rather than shadows.</li>
<li><strong>Radii:</strong> 2px buttons/tags/inputs, 4px cards/images, 12px frames for slides &amp; social. Pills only for dots.</li>
<li><strong>Shadows:</strong> none on screen UI; <code>--shadow-doc</code> for paper previews, <code>--shadow-pop</code> for popovers.</li>
<li><strong>Motion:</strong> 150–250ms ease-out; fade-in-up 16px on enter; LiveBadge pulses. Respect reduced motion.</li>
<li><strong>Imagery:</strong> one avatar (illustrated or dark-lit portrait) per surface, right-aligned, fading into the page. Project images in hairline 4px frames.</li>
<li><strong>Icons:</strong> Font Awesome 6.4 solid in a 44px hairline <code>.bn-icon-box</code>; functional only.</li>
</ul>
<h2>Accessibility</h2>
<ul>
<li>Text pairs meet WCAG AA 4.5:1 in both themes; UI boundaries (input borders <code>--line-input</code>, focus) meet 3:1.</li>
<li>Focus: every <code>:focus-visible</code> gets a 2px solid <code>--focus-color</code> outline with 2px offset (white on the blue band). Never replace it with a translucent shadow.</li>
<li>Header renders a &quot;Przejdź do treści&quot; skip link to <code>#main</code>; <code>scroll-padding-top</code> keeps focused/anchored content clear of the sticky header.</li>
<li>Touch targets are at least 44×44px on coarse pointers.</li>
<li><code>prefers-reduced-motion</code> disables animation, transitions and smooth scroll.</li>
</ul>
<h2>Components</h2>
<p>Core: Button, Eyebrow, Tag, TagList, LiveBadge, Segments, Counter, Stat, SectionHeader, PageHeader (<code>size</code> lg / md), CheckList.
Cards: CaseStudyCard, ServiceCard, CooperationCard (engagement formats as a ladder, one <code>featured</code>).
Content: Timeline, TimelineItem, ProblemListItem, TextSeparator, ArticleHeader, ArticleLayout (with <code>toc</code>: sticky ArticleToc beside the prose), ArticleToc, ArticleImage, PullQuote, ChallengeBlock, Pagination, Faq.
Forms: ContactForm.
Layout: Header, Logo, Hero, FinalCTA, Footer.</p>
<h2>Files</h2>
<ul>
<li><code>styles.css</code> → <code>tokens/</code> (fonts, colors, typography, spacing, effects, base, components)</li>
<li><code>components/&lt;group&gt;/&lt;Name&gt;/</code> — one folder per component: <code>.jsx</code>, <code>.d.ts</code>, <code>.prompt.md</code>, <code>.card.html</code> (groups: core, cards, content, forms, layout)</li>
<li><code>guidelines/</code> — foundation cards (colors, type, spacing, brand)</li>
<li><code>assets/favicon/</code> - favicon set (&quot;B.&quot; on an ink tile): <code>favicon.svg</code> snapped to the 32 px grid (retina tabs, mark centred), <code>favicon.ico</code> snapped to the 16 px grid (1x), <code>apple-touch-icon.png</code>, maskable <code>icon-192/512.png</code>, <code>site.webmanifest</code>. Head tags on the Favicon card in <code>guidelines/</code>.</li>
<li><code>templates/</code> — slides, LinkedIn post (20 layouts, 4:5 and 1:1), carousel (10 slides) and banner, PDF offer</li>
<li><code>ui_kits/website/</code> — website screens</li>
</ul>
<h2>Caveats</h2>
<ul>
<li>Fonts load from Google Fonts (Archivo, Geist, JetBrains Mono); self-host for production.</li>
<li>Avatar artwork is not included — slots are left for it.</li>
</ul>

const nav = document.getElementById('nav');
const stage = document.getElementById('stage');
const side = document.querySelector('.side');
const menu = document.querySelector('.menu');
const items = new Map([['readme', { group: 'Start', name: 'Readme', subtitle: 'Marka, zasady treści i fundamenty wizualne.', kind: 'readme' }]]);

// Templates are boards of full-size artboards (1080-1920px wide). They render at this
// width and scale down, so two posts or one slide fit side by side.
const TEMPLATE_WIDTH = 2400;

const link = (id, text) => Object.assign(document.createElement('a'), { href: '#' + id, textContent: text });
nav.append(link('readme', 'Readme'));
for (const { group, items: list } of NAV) {
  const details = document.createElement('details');
  details.open = true;
  details.append(Object.assign(document.createElement('summary'), { textContent: group }));
  for (const item of list) {
    items.set(item.path, item);
    details.append(link(item.path, item.name));
  }
  nav.append(details);
}

let resize;
function fit(frame, iframe, width, height) {
  const scale = Math.min(1, frame.clientWidth / width);
  iframe.style.transform = 'scale(' + scale + ')';
  frame.style.height = height * scale + 'px';
}

function fitTemplate(iframe) {
  const scale = Math.min(1, stage.clientWidth / TEMPLATE_WIDTH);
  iframe.width = TEMPLATE_WIDTH;
  iframe.height = Math.ceil(stage.clientHeight / scale);
  iframe.style.transform = 'scale(' + scale + ')';
}

function show() {
  const id = decodeURIComponent(location.hash.slice(1)) || 'readme';
  const item = items.get(id) || items.get('readme');
  const current = items.get(id) ? id : 'readme';
  for (const a of nav.querySelectorAll('a')) a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + current);
  document.getElementById('group').textContent = item.group;
  const title = document.getElementById('title');
  title.textContent = item.name;
  title.append(Object.assign(document.createElement('span'), { textContent: '.' }));
  document.getElementById('subtitle').textContent = item.subtitle;
  const open = document.getElementById('open');
  open.hidden = item.kind === 'readme';
  open.href = item.path || '';
  document.title = item.name + ' · Broniszewski. Design system';

  resize?.disconnect();
  stage.className = 'stage' + (item.kind === 'template' ? ' stage--template' : '');
  stage.replaceChildren();
  if (item.kind === 'readme') {
    const prose = Object.assign(document.createElement('article'), { className: 'prose' });
    prose.append(document.getElementById('readme').content.cloneNode(true));
    stage.append(prose);
  } else {
    const iframe = Object.assign(document.createElement('iframe'), { src: item.path, title: item.name });
    if (item.kind === 'card') {
      const frame = Object.assign(document.createElement('div'), { className: 'frame' });
      frame.style.maxWidth = item.width + 2 + 'px';
      iframe.width = item.width;
      iframe.height = item.height;
      frame.append(iframe);
      stage.append(frame);
      resize = new ResizeObserver(() => fit(frame, iframe, item.width, item.height));
      resize.observe(frame);
    } else {
      stage.append(iframe);
      resize = new ResizeObserver(() => fitTemplate(iframe));
      resize.observe(stage);
    }
  }
  side.classList.remove('is-open');
  menu.setAttribute('aria-expanded', 'false');
  document.getElementById('main').scrollTop = 0;
}

menu.addEventListener('click', () => {
  const open = side.classList.toggle('is-open');
  menu.setAttribute('aria-expanded', String(open));
});
addEventListener('hashchange', show);
show();
</script>
