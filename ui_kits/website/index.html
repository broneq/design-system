<script type="text/babel">
const { Header, Footer } = window.BroniszewskiDesignSystem_db82bc;
const HREF = { '/': 'home', '/uslugi': 'service', '/case-studies': 'cases', '/kontakt': 'contact' };
const LINKS = [{ href: '/', label: 'Start' }, { href: '/uslugi', label: 'Usługi' }, { href: '/case-studies', label: 'Case studies' }, { href: '/kontakt', label: 'Kontakt' }];
function App() {
  const [r, setR] = React.useState(() => { try { return JSON.parse(localStorage.getItem('bn-route')) || { page: 'home' }; } catch { return { page: 'home' }; } });
  const go = (page, slug) => { const n = { page, slug }; setR(n); localStorage.setItem('bn-route', JSON.stringify(n)); window.scrollTo(0, 0); };
  const current = { home: '/', service: '/uslugi', cases: '/case-studies', case: '/case-studies', contact: '/kontakt' }[r.page];
  const Screen = { home: HomeScreen, cases: CaseStudiesScreen, case: CaseStudyScreen, contact: ContactScreen, service: ServiceScreen }[r.page] || HomeScreen;
  const nav = (href) => go(HREF[href] || 'home');
  return <><Header dark links={LINKS} current={current} onNavigate={nav} extra="PL / EN" /><main><Screen go={go} slug={r.slug} /></main><Footer links={LINKS} onNavigate={nav} status="Wolne terminy od listopada" email="kontakt@broniszewski.net" /></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
